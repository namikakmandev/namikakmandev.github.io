<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yatırım Radarı — BIST · ABD Borsaları · Kıymetli Madenler · Emtia</title>
<meta name="description" content="BIST ve ABD hisseleri (NASDAQ/NYSE), kıymetli madenler ve emtialar için teknik + temel analiz radarı: 180/200 günlük ortalamalar, RSI, MACD, momentum, F/K, PD/DD ve bileşik skor." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="theme-color" content="#2F9BFF" />
<style>
  :root{
    --bg:#0b1017; --panel:#121926; --panel2:#0f1520; --line:#233047;
    --text:#e6e8ee; --muted:#8b94a7; --blue:#2F9BFF; --green:#19C37D;
    --orange:#FF6500; --red:#ff5a6a; --gold:#e8b93c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;padding-bottom:60px}
  a{color:var(--blue);text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}
  header.top{padding:26px 0 6px;position:relative}
  #langBtn{position:absolute;top:26px;right:0;z-index:5;border:1px solid var(--blue);background:rgba(47,155,255,.12);color:var(--blue);border-radius:999px;padding:7px 16px;font-size:13.5px;font-weight:800;letter-spacing:.05em;cursor:pointer}
  #langBtn:hover{background:var(--blue);color:#fff}
  .back{font-size:13px;color:var(--muted)}
  .back:hover{color:var(--blue)}
  h1{font-size:30px;margin:8px 0 4px;letter-spacing:-.02em}
  h1 .grad{background:linear-gradient(90deg,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);max-width:760px}
  .asof{font-size:13px;color:var(--muted);margin-top:6px}
  .asof b{color:var(--green);font-weight:600}
  .livechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    border-radius:999px;padding:2px 11px;margin-left:8px;vertical-align:1px}
  .livechip.on{color:var(--green);background:rgba(25,195,125,.12);border:1px solid rgba(25,195,125,.35)}
  .livechip.off{color:var(--muted);background:rgba(139,148,167,.1);border:1px solid var(--line)}
  .livechip i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .livechip.on i{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .disclaimer{margin:16px 0;padding:11px 14px;border:1px solid rgba(255,101,0,.4);background:rgba(255,101,0,.08);border-radius:10px;font-size:13px;color:#f0c9ad}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:18px;font-weight:700;margin-top:2px}
  .stat .c{font-size:12px;font-weight:600}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 18px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s}
  .chip:hover{color:var(--text)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .controls input[type=search]{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 12px;font-size:14px}
  .controls select{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 10px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .row{display:grid;grid-template-columns:34px minmax(150px,1.4fr) 150px minmax(120px,1fr) 130px;gap:14px;align-items:center;padding:13px 16px;cursor:pointer}
  .row:hover{background:var(--panel2)}
  .rank{color:var(--muted);font-size:13px;font-weight:700;text-align:center}
  .nm b{font-size:15px}
  .nm .sym{font-size:12px;color:var(--muted);margin-left:6px}
  .nm .mini{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:1px 7px;margin-top:3px;text-transform:uppercase}
  .tag.hisse{background:rgba(47,155,255,.15);color:var(--blue)}
  .tag.abd{background:rgba(180,140,255,.15);color:#b48cff}
  .tag.maden{background:rgba(232,185,60,.15);color:var(--gold)}
  .tag.emtia{background:rgba(255,101,0,.16);color:var(--orange)}
  .tag.endeks,.tag.doviz{background:rgba(139,148,167,.16);color:var(--muted)}
  .pr .p{font-weight:700;font-size:15px}
  .pr .c{font-size:12.5px;font-weight:600}
  .spark{width:100%;height:44px;display:block}
  .scorebox{text-align:right}
  .score-val{font-size:19px;font-weight:800}
  .score-lbl{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:1px 7px;display:inline-block}
  .s-olumlu{color:var(--green);background:rgba(25,195,125,.13)}
  .s-notr{color:var(--gold);background:rgba(232,185,60,.13)}
  .s-zayif{color:var(--red);background:rgba(255,90,106,.12)}
  .score-bar{height:5px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
  .score-bar i{display:block;height:100%;border-radius:4px}
  .detail{display:none;border-top:1px solid var(--line);padding:16px 18px;background:var(--panel2)}
  .card.open .detail{display:block}
  .comment{font-size:14px;color:#c6cdd9;border-left:3px solid var(--blue);padding:2px 0 2px 12px;margin-bottom:16px}
  .sigs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .sig{font-size:12px;font-weight:600;border-radius:999px;padding:3px 11px;border:1px solid transparent}
  .sig.pos{color:var(--green);border-color:rgba(25,195,125,.35);background:rgba(25,195,125,.08)}
  .sig.neg{color:var(--red);border-color:rgba(255,90,106,.35);background:rgba(255,90,106,.07)}
  .sig.warn{color:var(--gold);border-color:rgba(232,185,60,.35);background:rgba(232,185,60,.08)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){
    .grid2{grid-template-columns:1fr}
    .row{grid-template-columns:26px 1fr 110px;gap:10px}
    .row .sparkcell,.row .pr{display:none}
  }
  .detail h4{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
  table.kv{width:100%;border-collapse:collapse;font-size:13.5px}
  table.kv td{padding:5px 4px;border-bottom:1px solid rgba(35,48,71,.6)}
  table.kv td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .bars .b{margin-bottom:9px}
  .bars .bt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:3px}
  .bars .bt b{color:var(--text)}
  .bars .bg{height:7px;background:var(--line);border-radius:5px;overflow:hidden}
  .bars .bg i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--green))}
  .bigchart{width:100%;height:190px;display:block;margin-top:4px}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px}
  .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  .news li{list-style:none;font-size:13.5px;padding:5px 0;border-bottom:1px solid rgba(35,48,71,.6)}
  .news li a{color:var(--text)} .news li a:hover{color:var(--blue)}
  .news .nd{font-size:11.5px;color:var(--muted)}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--muted);margin:24px 0}
  .empty b{color:var(--text)}
  section.metho{margin-top:36px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
  section.metho h2{font-size:19px;margin-bottom:10px}
  section.metho p,section.metho li{font-size:13.5px;color:#b9c1cf}
  section.metho ul{margin:8px 0 8px 20px}
  section.metho b{color:var(--text)}
  /* ---- Notlar & geri bildirim ---- */
  section.notes-sec{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
  section.notes-sec h2{font-size:19px;margin-bottom:6px}
  section.notes-sec .hint{font-size:13px;color:var(--muted);margin-bottom:12px}
  .note-ta,#noteGeneral{width:100%;min-height:64px;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;color:var(--text);padding:10px 12px;font:13.5px/1.5 inherit;resize:vertical}
  #noteList{margin:12px 0;display:flex;flex-direction:column;gap:6px}
  #noteList .nrow{font-size:13px;color:#c6cdd9;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:7px 11px}
  #noteList .nrow b{color:var(--blue)}
  .note-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .note-actions button{border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
  #noteWa{background:#1faa55;color:#fff}
  #noteMail{background:var(--blue);color:#fff}
  #noteCopy{background:var(--panel2);color:var(--text);border:1px solid var(--line)!important}
  #noteClear{background:none;color:var(--muted);border:1px solid var(--line)!important}
  .note-saved{font-size:11.5px;color:var(--green);margin-left:6px;opacity:0;transition:.3s}
  .note-saved.show{opacity:1}
  /* ---- Bugün paneli ---- */
  section.today{background:linear-gradient(135deg,rgba(47,155,255,.10),rgba(25,195,125,.07));
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 18px}
  .t-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .t-greet{font-size:19px;font-weight:800}
  .t-date{font-size:13px;color:var(--muted);margin-top:2px}
  #tReportBtn{margin-left:auto;background:var(--blue);color:#fff;border:none;border-radius:10px;
    padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer}
  #tReportBtn:disabled{opacity:.55;cursor:default}
  .t-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .t-chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 13px;border:1px solid var(--line)}
  .t-chip.up{color:var(--green);border-color:rgba(25,195,125,.4);background:rgba(25,195,125,.08)}
  .t-chip.down{color:var(--red);border-color:rgba(255,90,106,.4);background:rgba(255,90,106,.07)}
  .t-chip.mid{color:var(--gold);border-color:rgba(232,185,60,.4);background:rgba(232,185,60,.08)}
  ul.t-hl{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:5px}
  ul.t-hl li{font-size:13.5px;color:#c6cdd9;padding-left:18px;position:relative}
  ul.t-hl li::before{content:"▸";position:absolute;left:2px;color:var(--blue)}
  .t-report{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:13.5px;
    color:#c6cdd9;white-space:pre-wrap;line-height:1.6}
  /* ---- Portföyüm ---- */
  #pfTable table{width:100%;border-collapse:collapse;font-size:13px}
  #pfTable th{color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  #pfTable th:first-child,#pfTable td:first-child{text-align:left}
  #pfTable td{padding:7px 6px;border-bottom:1px solid rgba(35,48,71,.6);text-align:right;font-variant-numeric:tabular-nums}
  #pfTable td b{font-size:13.5px}
  #pfTable .del{color:var(--red);cursor:pointer;font-weight:700;padding:0 5px}
  .pf-tot{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .pf-tot .stat{flex:1;min-width:150px}
  #pfForm{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  #pfForm select,#pfForm input{background:var(--bg);border:1px solid var(--line);border-radius:9px;
    color:var(--text);padding:8px 10px;font-size:13.5px}
  #pfForm select{flex:2;min-width:150px}
  #pfForm input{flex:1;min-width:90px;width:100px}
  #pfForm button{background:var(--green);color:#04140c;border:none;border-radius:9px;padding:8px 18px;font-weight:800;cursor:pointer}
  #pfWarn{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  #pfWarn .w{font-size:13px;border-radius:9px;padding:7px 11px;border:1px solid rgba(232,185,60,.4);
    background:rgba(232,185,60,.07);color:var(--gold)}
  #pfWarn .w.neg{border-color:rgba(255,90,106,.4);background:rgba(255,90,106,.06);color:var(--red)}
  tr.notable{cursor:pointer}
  tr.notable:hover td{background:rgba(47,155,255,.07)}
  .note-flag{margin-left:5px;font-size:11px}
  .ctx-note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;width:420px;
    max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--blue);border-radius:14px;
    padding:14px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
  .ctx-note .cn-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:8px}
  .ctx-note textarea{width:100%;min-height:70px;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;color:var(--text);padding:9px 11px;font:13.5px/1.5 inherit;resize:vertical}
  .ctx-note .cn-btns{display:flex;gap:8px;margin-top:9px}
  .ctx-note .cn-btns button{border:none;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:700;cursor:pointer}
  #cnSave{background:var(--blue);color:#fff}
  #cnDel{background:none;color:var(--red);border:1px solid rgba(255,90,106,.4)!important}
  #cnCancel{background:var(--panel2);color:var(--muted);border:1px solid var(--line)!important}
  /* ---- Radar Asistanı (AI sohbet) ---- */
  .ai-fab{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;align-items:center;gap:9px;
    background:linear-gradient(135deg,var(--blue),#1673d1);color:#fff;border:none;border-radius:999px;
    padding:12px 20px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 28px rgba(47,155,255,.45);
    transition:.2s}
  .ai-fab:hover{transform:translateY(-2px)}
  .ai-fab .dot{width:8px;height:8px;border-radius:50%;background:#7ef7c3;animation:pulse 1.8s infinite}
  .ai-panel{position:fixed;right:20px;bottom:20px;z-index:70;width:390px;max-width:calc(100vw - 24px);
    height:560px;max-height:calc(100vh - 40px);display:none;flex-direction:column;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.55);overflow:hidden}
  .ai-panel.open{display:flex}
  .ai-head{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--panel2);
    border-bottom:1px solid var(--line)}
  .ai-head .t{font-weight:800;font-size:15px}
  .ai-head .s{font-size:11.5px;color:var(--muted)}
  .ai-close{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
  .ai-close:hover{color:var(--text)}
  .ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .ai-m{max-width:88%;padding:9px 13px;border-radius:13px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:break-word}
  .ai-m.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
  .ai-m.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .ai-m.bot.err{border-color:rgba(255,90,106,.5);color:#f5b8be}
  .ai-m.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);
    margin-right:4px;animation:pulse 1s infinite}
  .ai-m.typing i:nth-child(2){animation-delay:.2s}.ai-m.typing i:nth-child(3){animation-delay:.4s}
  .ai-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
  .ai-chips button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;
    padding:5px 11px;font-size:12px;cursor:pointer}
  .ai-chips button:hover{color:var(--text);border-color:var(--blue)}
  .ai-inp{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line);background:var(--panel2)}
  .ai-inp input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);
    padding:9px 12px;font-size:14px}
  .ai-inp button{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:0 16px;
    font-weight:700;cursor:pointer;font-size:14px}
  .ai-inp button:disabled{opacity:.5;cursor:default}
  .ai-foot{font-size:10.5px;color:var(--muted);text-align:center;padding:0 14px 9px;background:var(--panel2)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="index.html" id="backLnk">← namikakman — ana sayfa</a>
    <button id="langBtn" title="Dil / Language">🌐 EN</button>
    <h1>Yatırım <span class="grad">Radarı</span></h1>
    <p class="sub" id="subTxt"></p>
    <div class="asof"><span id="asof"></span><span class="livechip" id="live" hidden><i></i><span id="livetxt"></span></span></div>
  </header>

  <div class="disclaimer" id="discTxt"></div>

  <div class="strip" id="strip"></div>

  <section class="today" id="todaySec" hidden>
    <div class="t-head">
      <div><div class="t-greet" id="tGreet"></div><div class="t-date" id="tDate"></div></div>
      <button id="tReportBtn"></button>
    </div>
    <div class="t-chips" id="tChips"></div>
    <ul class="t-hl" id="tHl"></ul>
    <div class="t-report" id="tReport" hidden></div>
  </section>

  <div class="controls">
    <div class="chips" id="chips">
      <button class="chip on" data-f="tumu">Tümü</button>
      <button class="chip" data-f="hisse">BIST</button>
      <button class="chip" data-f="abd">ABD Borsaları</button>
      <button class="chip" data-f="maden">Kıymetli Madenler</button>
      <button class="chip" data-f="emtia">Emtia</button>
      <button class="chip" data-f="diger">Endeks &amp; Döviz</button>
    </div>
    <input type="search" id="q" placeholder="Ara: THYAO, altın…" />
    <select id="sort">
      <option value="score">Sırala: Skor</option>
      <option value="chg1d">Günlük değişim</option>
      <option value="r3m">3 aylık getiri</option>
      <option value="rsi">RSI</option>
      <option value="pe">F/K (düşükten)</option>
      <option value="peg">PEG (düşükten)</option>
    </select>
  </div>

  <div id="list"></div>

  <section class="notes-sec" id="pfSec">
    <h2 id="pfH2"></h2>
    <p class="hint" id="pfHint"></p>
    <div id="pfTable"></div>
    <div class="pf-tot" id="pfTot"></div>
    <div id="pfWarn"></div>
    <form id="pfForm">
      <select id="pfSym"></select>
      <input id="pfQty" type="number" step="any" min="0" />
      <input id="pfCost" type="number" step="any" min="0" />
      <button type="submit" id="pfAdd"></button>
    </form>
  </section>

  <section class="notes-sec" id="notesSec">
    <h2 id="notesH2">📝 Notlar &amp; Geri Bildirim</h2>
    <p class="hint" id="notesHint"></p>
    <textarea id="noteGeneral" placeholder="Genel notunuz / geliştirme öneriniz… (otomatik kaydedilir)"></textarea>
    <div id="noteList"></div>
    <div class="note-actions">
      <button id="noteWa">WhatsApp ile gönder</button>
      <button id="noteMail">E-posta ile gönder</button>
      <button id="noteCopy">Panoya kopyala</button>
      <button id="noteClear">Tümünü temizle</button>
    </div>
  </section>

  <section class="metho" id="methoSec"></section>
</div>

<button class="ai-fab" id="aiFab"><span class="dot"></span><span id="aiFabTxt">Radar Asistanı</span></button>
<div class="ai-panel" id="aiPanel" role="dialog" aria-label="Radar Asistanı sohbet">
  <div class="ai-head">
    <div><div class="t" id="aiTitle">🤖 Radar Asistanı</div>
    <div class="s" id="aiSubTxt"></div></div>
    <button class="ai-close" id="aiClose" aria-label="Kapat">×</button>
  </div>

 metho:`<h2>Methodology</h2>
  <p>For every asset a 2-year daily close series is pulled from Yahoo Finance and scored in four buckets:</p>
  <ul>
   <li><b>Trend (35 pts):</b> distance to the 180- and 200-day simple moving averages, the 50/200 crossover (golden/death cross) and the slope of the 200-day average.</li>
   <li><b>Momentum (25 pts):</b> 3- and 6-month returns plus RSI-14 (overbought/oversold zones lose points).</li>
   <li><b>Valuation (25 pts, BIST & US stocks):</b> P/E, P/B, return on equity and dividend yield. A <b>PEG</b> ratio (P/E ÷ annual earnings growth; analyst consensus first, else realized growth) is also shown for information — below 1 is considered cheap vs growth; for TRY stocks growth is nominal (inflation-inflated), so very low PEGs deserve caution.</li>
   <li><b>Risk (15 pts):</b> 30-day annualized volatility and drawdown from the 52-week high.</li>
  </ul>
  <p>Assets without valuation data (gold, silver, commodities, indices) are rescaled to 100 from the remaining 75 points. <b>65+</b> Positive, <b>45–65</b> Neutral, below <b>45</b> Weak.</p>

const fmtN=(v,d=2)=>v==null?"—":v.toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtPct=(v,d=1)=>v==null?"—":(v>0?"+":"")+(v*100).toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
const cur=c=>c==="TRY"?"₺":(c==="USD"?"$":(c||""));
const price=a=>{
  const p=a.tech.price;
  const d=p>=1000?0:(p>=10?2:3);
  return fmtN(p,d)+" "+cur(a.currency);
};

function signals(a){
  const t=a.tech,f=a.fund||{},S=T().sig,out=[];
  if(t.vs_sma200!=null) out.push(t.vs_sma200>=0
    ?["pos",S.above200(fmtPct(t.vs_sma200))]:["neg",S.below200(fmtPct(t.vs_sma200))]);
  if(t.vs_sma180!=null) out.push([t.vs_sma180>=0?"pos":"neg",S.s180(fmtPct(t.vs_sma180))]);
  if(t.sma50!=null&&t.sma200!=null) out.push(t.sma50>t.sma200?["pos",S.golden]:["neg",S.death]);
  if(t.rsi14!=null){
    if(t.rsi14>70) out.push(["warn",S.rsiOB(fmtN(t.rsi14,0))]);
    else if(t.rsi14<30) out.push(["warn",S.rsiOS(fmtN(t.rsi14,0))]);
    else out.push([t.rsi14>=45?"pos":"warn",S.rsi(fmtN(t.rsi14,0))]);
  }
  if(t.macd_hist!=null) out.push([t.macd_hist>0?"pos":"neg",t.macd_hist>0?S.macdP:S.macdN]);
  if(t.r3m!=null&&Math.abs(t.r3m)>0.10) out.push([t.r3m>0?"pos":"neg",S.r3m(fmtPct(t.r3m))]);
  if(t.from_hi52!=null&&t.from_hi52>-0.03) out.push(["pos",S.nearHi]);
  if(f.trailing_pe!=null){
    if(f.trailing_pe>0&&f.trailing_pe<8) out.push(["pos",S.lowPE(fmtN(f.trailing_pe,1))]);
    else if(f.trailing_pe>30) out.push(["warn",S.highPE(fmtN(f.trailing_pe,1))]);
  }
  if(f.peg!=null){
    if(f.peg<1&&f.peg_growth<=0.6) out.push(["pos",S.pegCheap(fmtN(f.peg,2))]);
    else if(f.peg>2.5) out.push(["warn",S.pegRich(fmtN(f.peg,2))]);
  }
  if(f.revenue_growth!=null){
    if(f.revenue_growth>0.15) out.push(["pos",S.rev(fmtPct(f.revenue_growth,0))]);
    else if(f.revenue_growth<0) out.push(["neg",S.rev(fmtPct(f.revenue_growth,0))]);
  }
  if(f.dividend_yield>0.04) out.push(["pos",S.div(fmtPct(f.dividend_yield))]);
  return out;
}

function comment(a){
  const t=a.tech,sc=a.score,f=a.fund||{},C=T().cm,p=[];
  if(t.vs_sma200!=null)
    p.push(t.vs_sma200>=0?C.up(fmtPct(t.vs_sma200)):C.down(fmtPct(Math.abs(t.vs_sma200))));
  if(t.r6m!=null)p.push(t.r6m>=0?C.r6p(fmtPct(t.r6m)):C.r6n(fmtPct(Math.abs(t.r6m))));
  if(a.type==="hisse"||a.type==="abd"){
    if(f.trailing_pe>0&&f.price_to_book>0)
      p.push(C.ratios(fmtN(f.trailing_pe,1),fmtN(f.price_to_book,1),f.roe!=null?fmtPct(f.roe,0):null));
  }
  if(t.rsi14>70)p.push(C.ob);else if(t.rsi14<30)p.push(C.os);
  p.push(C.total(fmtN(sc.total,0),T().lbl[sc.label]||sc.label));
  return p.join(" ");
}

function drawSpark(cv,sp,big){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||300,h=cv.clientHeight||44;
  cv.width=w*dpr;cv.height=h*dpr;
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const series=[sp.close,sp.sma180,sp.sma200];
  const all=series.flat().filter(v=>v!=null);
  if(!all.length)return;
  const min=Math.min(...all),max=Math.max(...all),pad=big?10:3;
  const X=i=>i/(sp.close.length-1)*(w-2)+1;
  const Y=v=>h-pad-(v-min)/((max-min)||1)*(h-2*pad);
  const line=(vals,color,width,dash)=>{
    ctx.beginPath();ctx.setLineDash(dash||[]);
    let started=false;
    vals.forEach((v,i)=>{if(v==null)return;
      started?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v));started=true;});
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([]);
  };
  // kapanış altını hafif doldur
  ctx.beginPath();
  sp.close.forEach((v,i)=>{i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v));});
  ctx.lineTo(X(sp.close.length-1),h);ctx.lineTo(X(0),h);ctx.closePath();
  ctx.fillStyle="rgba(47,155,255,0.10)";ctx.fill();
  line(sp.sma200,"rgba(139,148,167,0.9)",big?1.5:1,[4,3]);
  line(sp.sma180,"rgba(255,101,0,0.9)",big?1.5:1,[2,3]);
  line(sp.close,"#2F9BFF",big?2:1.4);
  const last=sp.close[sp.close.length-1];
  ctx.beginPath();ctx.arc(X(sp.close.length-1),Y(last),big?3:2,0,7);
  ctx.fillStyle="#19C37D";ctx.fill();
}

/* ---- Canlı fiyat katmanı ----------------------------------------------
   GitHub Pages statik olduğundan Yahoo'ya doğrudan fetch CORS'a takılır;
   halka açık CORS ara katmanları zincirleme denenir. Hepsi başarısız olursa
   sayfa sessizce Actions'ın ürettiği (en fazla 15 dk eski) veriyle kalır. */
const PROXIES=[
  u=>"https://corsproxy.io/?url="+encodeURIComponent(u),
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
  u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),
];
let proxyIdx=0, liveEverOk=false, liveBusy=false;

async function fetchVia(url){
  for(let i=0;i<PROXIES.length;i++){
    const k=(proxyIdx+i)%PROXIES.length;
    try{
      const r=await fetch(PROXIES[k](url),{signal:AbortSignal.timeout(12000)});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();
      proxyIdx=k; // çalışan ara katmanı hatırla
      return j;
    }catch(e){/* sıradakini dene */}
  }
  return null;
}

function sparkMeta(j){
  // v7/finance/spark iki şekilde dönebiliyor: {spark:{result:[...]}} veya {result:[...]}
  const res=(j&&j.spark&&j.spark.result)||(j&&j.result)||[];
  const out={};
  for(const r of res){
    const m=r&&r.response&&r.response[0]&&r.response[0].meta;
    if(m&&m.regularMarketPrice!=null)
      out[r.symbol]={p:m.regularMarketPrice,prev:m.chartPreviousClose??m.previousClose??null};
  }
  return out;
}

async function liveTick(){
  if(liveBusy||!DATA||document.visibilityState!=="visible")return;
  liveBusy=true;
  try{
    const syms=DATA.assets.map(a=>a.symbol).filter(s=>s!=="GRAMALTIN");
    let quotes={};
    for(let i=0;i<syms.length;i+=16){
      const u="https://query1.finance.yahoo.com/v7/finance/spark?symbols="
        +encodeURIComponent(syms.slice(i,i+16).join(","))+"&range=1d&interval=15m";
      Object.assign(quotes,sparkMeta(await fetchVia(u)));
    }
    if(!Object.keys(quotes).length){
      // spark çalışmadıysa en azından özet şeridi tekil chart uçlarından besle
      for(const s of ["XU100.IS","USDTRY=X","GC=F"]){
        const j=await fetchVia("https://query1.finance.yahoo.com/v8/finance/chart/"
          +encodeURIComponent(s)+"?range=1d&interval=15m");
        const m=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta;
        if(m&&m.regularMarketPrice!=null)
          quotes[s]={p:m.regularMarketPrice,prev:m.chartPreviousClose??m.previousClose??null};
      }
    }
    // gram altın türev: ons altın / 31.1035 × USD/TRY
    if(quotes["GC=F"]&&quotes["USDTRY=X"]){
      const g=quotes["GC=F"],f=quotes["USDTRY=X"];
      quotes["GRAMALTIN"]={p:g.p/31.1034768*f.p,
        prev:(g.prev&&f.prev)?g.prev/31.1034768*f.prev:null};
    }
    let n=0;
    for(const a of DATA.assets){
      const q=quotes[a.symbol];
      if(!q)continue;
      a.tech.price=q.p;
      if(q.prev)a.tech.chg1d=q.p/q.prev-1;
      n++;
    }
    if(n){liveEverOk=true;refreshPrices();}
    setLiveChip(n>0);
  }finally{liveBusy=false;}
}

function regime(sym){
  const a=DATA.assets.find(x=>x.symbol===sym);
  if(!a)return null;
  const t=a.tech;
  if(t.vs_sma200==null||t.sma200_slope20==null)return null;
  const st=t.vs_sma200>0&&t.sma200_slope20>0?"up":(t.vs_sma200<0&&t.sma200_slope20<0?"down":"mid");
  return {st,chg:t.chg1d};
}
function freshCross(a){
  // spark 2 günde bir örneklenir; son ~4 nokta ≈ 8 gün içinde SMA200 kesişimi ara
  const c=a.spark.close,m=a.spark.sma200;
  if(!c||!m)return 0;
  for(let i=c.length-1;i>Math.max(1,c.length-5);i--){
    if(c[i]==null||m[i]==null||c[i-1]==null||m[i-1]==null)continue;
    if(c[i-1]<=m[i-1]&&c[i]>m[i])return 1;
    if(c[i-1]>=m[i-1]&&c[i]<m[i])return -1;
  }
  return 0;
}

  const top=DATA.assets[0];
  hl.push(L.tTop(top.name,fmtN(top.score.total,0)));
  const movers=DATA.assets.filter(a=>a.tech.chg1d!=null).slice().sort((x,y)=>y.tech.chg1d-x.tech.chg1d);
  if(movers.length){
    hl.push(L.tBest(movers[0].name,fmtPct(movers[0].tech.chg1d)));
    hl.push(L.tWorst(movers[movers.length-1].name,fmtPct(movers[movers.length-1].tech.chg1d)));
  }
  const ob=DATA.assets.filter(a=>a.tech.rsi14>70).length;
  if(ob)hl.push(L.tOB(ob));
  for(const a of DATA.assets){
    const x=freshCross(a);
    if(x===1)hl.push(L.tCross(a.name));
    else if(x===-1)hl.push(L.tCrossD(a.name));
    if(hl.length>=7)break;
  }
  $("#tHl").innerHTML=hl.map(x=>`<li>${x}</li>`).join("");
}

/* ---- Portföyüm: cihazda saklanır, radar fiyatlarıyla değerlenir ---- */
const PF_KEY="radarPortfoy";
function getPf(){try{return JSON.parse(localStorage.getItem(PF_KEY))||[]}catch(e){return[]}}
function setPf(v){localStorage.setItem(PF_KEY,JSON.stringify(v));renderPortfolio();}
function usdtry(){
  const fx=DATA&&DATA.assets.find(x=>x.symbol==="USDTRY=X");
  return fx?fx.tech.price:null;
}
function renderPortfolio(){
  if(!DATA)return;
  const L=T(),pf=getPf();
  // sembol seçici
  const sel=$("#pfSym");
  const cur_v=sel.value;
  sel.innerHTML=DATA.assets.slice().sort((a,b)=>a.name.localeCompare(b.name,LOC()))
    .map(a=>`<option value="${a.symbol}">${a.name} (${a.symbol})</option>`).join("");
  if(cur_v)sel.value=cur_v;
  if(!pf.length){
    $("#pfTable").innerHTML=`<p style="color:var(--muted);font-size:13px">${L.pfEmpty}</p>`;
    $("#pfTot").innerHTML="";$("#pfWarn").innerHTML="";
    return;
  }
  let rows="",totTRY=0,totUSD=0,dayTRY=0,dayUSD=0;
  for(let i=0;i<pf.length;i++){
    const h=pf[i],a=DATA.assets.find(x=>x.symbol===h.sym);
    if(!a){continue;}
    const p=a.tech.price,val=h.qty*p,cost=h.qty*h.cost;
    const pl=val-cost,plp=cost?pl/cost:null;
    const prev=a.tech.chg1d!=null?p/(1+a.tech.chg1d):p;
    const day=h.qty*(p-prev);
    const isTRY=a.currency==="TRY";
    if(isTRY){totTRY+=val;dayTRY+=day;}else{totUSD+=val;dayUSD+=day;}
    rows+=`<tr>
      <td><b>${a.name}</b> <span style="color:var(--muted);font-size:11px">${a.symbol}</span></td>
      <td>${fmtN(h.qty,h.qty%1?2:0)}</td>
      <td>${fmtN(h.cost)}</td>
      <td>${fmtN(p)}</td>
      <td>${fmtN(val,0)} ${cur(a.currency)}</td>
      <td class="${pl>=0?"up":"down"}">${fmtN(pl,0)} (${plp!=null?fmtPct(plp):"—"})</td>
      <td class="${day>=0?"up":"down"}">${fmtN(day,0)}</td>
      <td><span class="del" data-i="${i}" title="×">×</span></td></tr>`;
  }
  $("#pfTable").innerHTML=`<div style="overflow-x:auto"><table><tr>${L.pfCols.map(c=>`<th>${c}</th>`).join("")}</tr>${rows}</table></div>`;
  const fx=usdtry();
  const tl=totTRY+(fx?totUSD*fx:0);
  const dayTl=dayTRY+(fx?dayUSD*fx:0);
  let tot="";
  if(fx&&(totTRY||totUSD))tot+=`<div class="stat"><div class="k">${L.pfTotTL}</div><div class="v">${fmtN(tl,0)} ₺</div><div class="c ${dayTl>=0?"up":"down"}">${(dayTl>=0?"+":"")+fmtN(dayTl,0)} ₺ ${L.pfDay}</div></div>`;
  if(totTRY)tot+=`<div class="stat"><div class="k">${L.pfTotTRY}</div><div class="v">${fmtN(totTRY,0)} ₺</div><div class="c ${dayTRY>=0?"up":"down"}">${(dayTRY>=0?"+":"")+fmtN(dayTRY,0)} ₺</div></div>`;
  if(totUSD)tot+=`<div class="stat"><div class="k">${L.pfTotUSD}</div><div class="v">${fmtN(totUSD,0)} $</div><div class="c ${dayUSD>=0?"up":"down"}">${(dayUSD>=0?"+":"")+fmtN(dayUSD,0)} $</div></div>`;
  $("#pfTot").innerHTML=tot;
  // pozisyon uyarıları — yalnız warn/neg sinyaller
  const warns=[];
  for(const h of pf){
    const a=DATA.assets.find(x=>x.symbol===h.sym);
    if(!a)continue;
    for(const [k,txt] of signals(a))
      if(k!=="pos")warns.push(`<div class="w ${k==="neg"?"neg":""}">${a.name}: ${txt}</div>`);
  }
  $("#pfWarn").innerHTML=warns.slice(0,6).join("");
}
$("#pfForm").addEventListener("submit",e=>{
  e.preventDefault();
  const sym=$("#pfSym").value,qty=parseFloat($("#pfQty").value),cost=parseFloat($("#pfCost").value);
  if(!sym||!(qty>0)||!(cost>=0))return;
  const pf=getPf();
  const ex=pf.find(h=>h.sym===sym);
  if(ex){ // aynı sembol: ağırlıklı ortalama maliyetle birleştir
    ex.cost=(ex.qty*ex.cost+qty*cost)/(ex.qty+qty);ex.qty+=qty;
  }else pf.push({sym,qty,cost});
  setPf(pf);
  $("#pfQty").value="";$("#pfCost").value="";
});
$("#pfTable").addEventListener("click",e=>{

});

/* ---- Radar Asistanı: sitedeki paylaşımlı Anthropic proxy'sini kullanır
   (assetix-ai worker — FiloDesk, ASSETIX, ProjeFin ile aynı uç nokta). ---- */
const AI_PROXY_URL="https://assetix-ai.akmannamik83.workers.dev";
const AI_SYSTEM=
  "Sen 'Yatırım Radarı' adlı web aracının yardımcı asistanısın. Araç; BIST hisseleri, ABD hisseleri "+
  "(NASDAQ/NYSE), kıymetli madenler, emtia, BIST 100, S&P 500, Nasdaq, Dow Jones ve Dolar/TL için teknik + temel göstergeleri 0-100 arası bileşik skora indirger. "+
  "Skorlama: Trend 35 puan (fiyatın 180 ve 200 günlük ortalamalara uzaklığı, 50/200 golden-death cross, "+
  "200g ortalamanın eğimi) + Momentum 25 puan (3A ve 6A getiri, RSI-14; aşırı alım/satım puan kırar) + "+
  "Değerleme 25 puan (BIST ve ABD hisseleri: F/K, PD/DD, ROE, temettü verimi; PEG=F/K÷kâr büyümesi ayrıca verilir, skora girmez; TL hisselerde büyüme nominal olduğundan enflasyon şişirmesi olabilir, %60 üstü büyümeye dayalı PEG düşüklüğünü temkinli yorumla) + Risk 15 puan (30g volatilite, "+
  "52 hafta zirvesinden uzaklık). Değerleme verisi olmayan varlıklar 75 puan üzerinden 100'e ölçeklenir. "+
  "65+ Olumlu, 45-65 Nötr, 45 altı Zayıf. "+
  "Sana her soruda 'GÜNCEL RADAR VERİSİ' bloğu verilir — yanıtlarını SADECE bu verilerle ve genel finans "+
  "bilginle kur; verilmeyen bir rakamı ASLA uydurma, emin değilsen 'bu veri bende yok' de. "+
  "Kısa, net ve sade Türkçe yanıtla; kullanıcı başka dilde yazarsa o dilde yanıtla. Sayıları Türkçe biçimde ver. "+
  "Belirli bir varlığı değerlendirirken güçlü VE zayıf yönleri dengeli söyle. "+
  "Al/sat önerisi isteyen sorularda göstergelerin ne söylediğini açıkla ama kişisel alım-satım talimatı verme; "+
  "yorum içeren her yanıtın sonuna kısaca 'yatırım tavsiyesi değildir' hatırlatması ekle.";
let aiHist=[],aiBusy=false;

function aiContext(){
  if(!DATA)return"Veri henüz yüklenmedi.";
  const L=[`VERİ ZAMANI: ${new Date(DATA.asof).toLocaleString("tr-TR")}`,
           "VARLIKLAR (bileşik skora göre sıralı):"];
  for(const a of DATA.assets){
    const t=a.tech,f=a.fund||{},s=a.score;
    let l=`- ${a.name} [${a.symbol}] tür=${a.type} fiyat=${fmtN(t.price,2)} ${cur(a.currency)} `+
      `günlük=${fmtPct(t.chg1d)} SKOR=${s.total} (${s.label}; trend ${s.trend}/35, momentum ${s.momentum}/25, `+
      `değerleme ${s.value==null?"yok":s.value+"/25"}, risk ${s.risk}/15) `+
      `200g_ort_fark=${fmtPct(t.vs_sma200)} 180g_ort_fark=${fmtPct(t.vs_sma180)} `+
      `RSI=${t.rsi14==null?"—":t.rsi14.toFixed(0)} 3A=${fmtPct(t.r3m)} 6A=${fmtPct(t.r6m)} 12A=${fmtPct(t.r12m)} `+
      `vol30=${fmtPct(t.vol30,0)} 52h_zirveden=${fmtPct(t.from_hi52)} `+
      `${t.sma50!=null&&t.sma200!=null?(t.sma50>t.sma200?"golden_cross":"death_cross"):""}`;
    if(f.trailing_pe!=null)l+=` FK=${f.trailing_pe.toFixed(1)}`;
    if(f.forward_pe!=null)l+=` ileri_FK=${f.forward_pe.toFixed(1)}`;
    if(f.price_to_book!=null)l+=` PDDD=${f.price_to_book.toFixed(2)}`;
    if(f.peg!=null)l+=` PEG=${f.peg.toFixed(2)}`;
    if(f.roe!=null)l+=` ROE=${fmtPct(f.roe,0)}`;
    if(f.dividend_yield!=null)l+=` temettü=${fmtPct(f.dividend_yield)}`;
    if(f.debt_to_equity!=null)l+=` borç/özkaynak=%${f.debt_to_equity.toFixed(0)}`;
    L.push(l);
    if(a.news&&a.news.length)L.push(`  son haberler: ${a.news.map(n=>n.t).join(" | ")}`);
  }
  const pf=getPf();
  if(pf.length){
    L.push("",T().pfAiHdr+":");
    for(const h of pf){
      const a=DATA.assets.find(x=>x.symbol===h.sym);
      if(!a)continue;
      const val=h.qty*a.tech.price,pl=val-h.qty*h.cost;
      L.push(`- ${a.name} [${h.sym}]: ${h.qty} adet, maliyet ${fmtN(h.cost)}, güncel ${fmtN(a.tech.price)} ${cur(a.currency)}, K/Z ${fmtN(pl,0)} ${cur(a.currency)}`);
    }
  }
  return L.join("\n");
}

function aiMsg(cls,text){
  const el=document.createElement("div");
  el.className="ai-m "+cls;
  if(cls.includes("typing"))el.innerHTML="<i></i><i></i><i></i>";
  else el.textContent=text;
  $("#aiMsgs").appendChild(el);
  $("#aiMsgs").scrollTop=$("#aiMsgs").scrollHeight;
  return el;
}

async function aiAsk(q){
  if(aiBusy||!q.trim())return;
  aiBusy=true;$("#aiSend").disabled=true;
  aiMsg("user",q);
  const typing=aiMsg("bot typing","");
  const hist=aiHist.slice(-6).map(h=>(h.role==="user"?"KULLANICI: ":"ASİSTAN: ")+h.text).join("\n");
  const prompt=`GÜNCEL RADAR VERİSİ\n${aiContext()}\n\n`+
    (hist?`ÖNCEKİ SOHBET\n${hist}\n\n`:"")+`KULLANICININ YENİ SORUSU\n${q}`+(LANG==="en"?"\n\n(Arayüz dili İngilizce — İngilizce yanıtla / answer in English.)":"");
  let out;
  try{
    const r=await fetch(AI_PROXY_URL,{method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({prompt,system:AI_SYSTEM}),
      signal:AbortSignal.timeout(60000)});
    const j=await r.json().catch(()=>({}));
    out=r.ok?{text:j.text||""}:{error:j.error||(T().aiErrPre+" ("+r.status+")")};
  }catch(e){out={error:T().aiErr};}
  typing.remove();
  if(out.error)aiMsg("bot err",out.error);
  else{
    aiMsg("bot",out.text);
    aiHist.push({role:"user",text:q},{role:"bot",text:out.text});
  }
  aiBusy=false;$("#aiSend").disabled=false;$("#aiText").focus();
}

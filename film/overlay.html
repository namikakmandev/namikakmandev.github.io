<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Parite: Sığır — çekim üstü bilgi katmanı</title>
<style>*{margin:0}html,body{height:100%;background:transparent;overflow:hidden}
canvas#c{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Çekim üstü bilgi katmanı — ?k=shot01 .. shot12
   Saydam zeminli tek kare (Playwright omitBackground ile PNG-alpha).
   Her rakam data/cattle-*.json'dan doğrulanmıştır. */
const OV={
 shot01:{kick:'ABD · 1971—2026',
  h:'55 yılda 3,5 kat',
  s:'1971: 1 kg sığır 0,71 kg mısır ederdi. Bugün: 2,44 kg.',
  cmp:null},
 shot02:{kick:'SORU',
  h:'1 kilo et, kaç kilo yem?',
  s:'Cevap her yıl değişiyor — hikâyeyi bu değişim anlatıyor.',
  cmp:null},
 shot03:{kick:'MEKANİZMA',
  h:'Yem, en büyük maliyet',
  s:'Parite düşerse üretici zarar eder; zarar eden üretici sürüyü küçültür.',
  cmp:null},
 shot05:{kick:'ABD · 2012—2014',
  h:'Kuraklık yılları',
  s:'Sürü daraldı, et fırladı: parite 2014’te 1,87× ile dönemin zirvesinde.',
  cmp:null},
 shot06:{kick:'ABD · 2015—2016',
  h:'Zirvenin bedeli',
  s:'Yüksek fiyat sürüyü yeniden büyüttü — parite iki yılda %42 düştü.',
  cmp:null},
 shot07:{kick:'PAYDA: YEM',
  h:'Mısır +%153',
  s:'ABD mısır ÜFE, 2020→2022 arasında iki buçuk katına çıktı.',
  cmp:null},
 shot08:{kick:'2021—2022 · KÜRESEL ŞOK',
  h:'Parite on yılın dibinde',
  s:'Yem şoku ABD’de pariteyi 0,58×’e indirdi — üretici için alarm.',
  cmp:null},
 shot09:{kick:'AVRUPA BİRLİĞİ',
  h:'Aynı döngü, aynı yön',
  s:'2022 dibi 1,42× → 2026 rekoru 3,51×. Sürü daralması fiyatı uçurdu.',
  cmp:['Bugün','ABD 2,44×','AB 2,82×','TR 1,31×']},
 shot10:{kick:'TÜRKİYE',
  h:'Dip ve dönüş',
  s:'2021’de 0,70× ile ezilen üretici, 2024’te 1,40× ile nefes aldı.',
  cmp:['Bugün','ABD 2,44×','AB 2,82×','TR 1,31×']},
 shot12:{kick:'ÜÇ KITA · TEK KURAL',
  h:'Yem belirler.',
  s:'Yem pahalanırsa sürü küçülür; sürü küçülürse et — her yerde — pahalanır.',
  cmp:['2015’ten beri','ABD +%62','AB +%23','TR +%20']},
};
const K=new URLSearchParams(location.search).get('k')||'shot01';
const O=OV[K];
const W=1080,H=1920;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COL={line:'#ffb056',dim:'#e8dfd0',dimmer:'#cbbfa8',
 card:'rgba(10,8,4,.72)',edge:'rgba(255,176,86,.45)'};

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

function draw(){
  ctx.clearRect(0,0,W,H);

  /* üst etiket: hap */
  ctx.font='600 34px "IBM Plex Mono",monospace';
  const kw=ctx.measureText(O.kick).width+72;
  ctx.fillStyle=COL.card;ctx.strokeStyle=COL.edge;ctx.lineWidth=2;
  roundRect((W-kw)/2,140,kw,74,37);ctx.fill();ctx.stroke();
  ctx.fillStyle=COL.line;ctx.textAlign='center';
  ctx.fillText(O.kick,W/2,190);

  /* alt kart */
  const hasCmp=!!O.cmp;
  const ch=hasCmp?330:250, cy=H-330-ch, cx=70, cw=W-140;
  ctx.fillStyle=COL.card;ctx.strokeStyle=COL.edge;ctx.lineWidth=2;
  roundRect(cx,cy,cw,ch,20);ctx.fill();ctx.stroke();
  /* amber şerit */
  ctx.fillStyle=COL.line;
  roundRect(cx,cy,10,ch,5);ctx.fill();

  ctx.textAlign='left';
  ctx.fillStyle='#f5efe6';ctx.font='700 60px "IBM Plex Sans",sans-serif';
  ctx.fillText(O.h,cx+48,cy+92);
  ctx.fillStyle=COL.dimmer;ctx.font='400 36px "IBM Plex Sans",sans-serif';
  wrap(O.s,cx+48,cy+156,cw-96,50);

  /* karşılaştırma satırı */
  if(hasCmp){
    const yy=cy+ch-62;
    ctx.font='600 30px "IBM Plex Mono",monospace';
    ctx.fillStyle=COL.dimmer;
    ctx.fillText(O.cmp[0].toUpperCase(),cx+48,yy);
    const cols=[COL.line,'#8aa0d8','#e2574c'];
    let xx=cx+48+ctx.measureText(O.cmp[0].toUpperCase()).width+44;
    for(let i=1;i<O.cmp.length;i++){
      ctx.fillStyle=cols[i-1];ctx.font='700 34px "IBM Plex Mono",monospace';
      ctx.fillText(O.cmp[i],xx,yy);
      xx+=ctx.measureText(O.cmp[i]).width+44;
    }
  }
}
function wrap(txt,x,y,maxw,lh){
  const words=txt.split(' ');let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxw){ctx.fillText(line,x,y);y+=lh;line=w;}
    else line=t;
  }
  if(line)ctx.fillText(line,x,y);
}
draw();
window.__ready=true;
</script>
</body>
</html>

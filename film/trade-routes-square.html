const KX = Math.cos(35*Math.PI/180), W360 = 360*KX;
function smooth(pts){                                       // Catmull-Rom through the waypoints, in map units
  const P = pts.map(p => [p[0]*KX, -p[1]]), out = [], n = P.length;
  for(let i=0;i<n-1;i++){
    const p0=P[Math.max(0,i-1)], p1=P[i], p2=P[i+1], p3=P[Math.min(n-1,i+2)];
    const steps = Math.max(2, Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/0.8));
    for(let s=0;s<steps;s++){
      const u=s/steps,u2=u*u,u3=u2*u;
      out.push([0.5*(2*p1[0]+(p2[0]-p0[0])*u+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2+(3*p1[0]-p0[0]-3*p2[0]+p3[0])*u3),
                0.5*(2*p1[1]+(p2[1]-p0[1])*u+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2+(3*p1[1]-p0[1]-3*p2[1]+p3[1])*u3)]);
    }
  }
  out.push(P[n-1]);
  const cum=[0]; for(let i=1;i<out.length;i++) cum.push(cum[i-1]+Math.hypot(out[i][0]-out[i-1][0],out[i][1]-out[i-1][1]));
  return {pt:out, cum, len:cum[cum.length-1]};
}

ROUTES.forEach((r,i)=>{ r.i=i; r.ts=T(r.s); r.te=r.e==null?Infinity:T(r.e); r.paths=r.p.map(smooth);
  const xs=r.paths.flatMap(p=>p.pt.map(q=>q[0])); r.wrap=Math.min(...xs)<-180*KX||Math.max(...xs)>180*KX; });
CAPS.forEach(c=>{ c.r=ROUTES.find(r=>r.n.startsWith(c[0])); if(!c.r) throw new Error('no route '+c[0]); });
const landPath = new Path2D();
for(const ring of (window.TRADE_LAND||[])){                // rings that cross the antimeridian are unwrapped, then put back in the copy they mostly belong to; the map is drawn three times side by side
  const xs=[ring[0]]; let off=0, sum=ring[0];
  for(let i=2;i<ring.length;i+=2){ const d=ring[i]-ring[i-2]; if(d>180) off-=360; else if(d<-180) off+=360; xs.push(ring[i]+off); sum+=ring[i]+off; }
  const shift=-360*Math.round(sum/xs.length/360);
  landPath.moveTo((xs[0]+shift)*KX,-ring[1]); for(let i=1;i<xs.length;i++) landPath.lineTo((xs[i]+shift)*KX,-ring[2*i+1]);
  landPath.closePath();
}


const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1080, H=1080, MAPT=250, MAPH=640, BY=MAPT+MAPH;
const C={bg:'#0B1E3A', sea:'#0C2142', land:'#1A3A66', coast:'#31598C', line:'#2B4A73', fg:'#F3F6FB', soft:'#D5DEEC', muted:'#93A8C4', seaR:'#5AABFF', landR:'#F5953A'};
const col=r=>r.k==='sea'?C.seaR:C.landR;
const OFFS=[-W360,0,W360];
const VIEW_OLD={lon:57.5,lat:25,S:W/(155*KX)}, VIEW_ALL={lon:10,lat:10,S:W/W360};
function trace(path,f){ const pt=path.pt,cum=path.cum,L=f*path.len; ctx.moveTo(pt[0][0],pt[0][1]);
  for(let i=1;i<pt.length;i++){ if(cum[i]<=L){ctx.lineTo(pt[i][0],pt[i][1]);continue;} const u=(L-cum[i-1])/((cum[i]-cum[i-1])||1); ctx.lineTo(lerp(pt[i-1][0],pt[i][0],u),lerp(pt[i-1][1],pt[i][1],u)); break; } }
function along(path,f){ const L=f*path.len,cum=path.cum; let lo=0,hi=cum.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(cum[m]<=L) lo=m; else hi=m;}
  const u=(L-cum[lo])/((cum[hi]-cum[lo])||1); return [lerp(path.pt[lo][0],path.pt[hi][0],u),lerp(path.pt[lo][1],path.pt[hi][1],u)]; }
const ease=u=>u*u*(3-2*u);

function render(f){
  f=clamp(f,0,TOTAL);
  let t, mode;
  if(f<HOOK){ t=TEND+3; mode='hook'; } else if(f<START){ t=TEND*(1-ease((f-HOOK)/REW)); mode='rewind'; }
  else { t=f-START; mode = t<ENDCARD ? 'play' : 'end'; }
  const endA = mode==='end' ? clamp((t-ENDCARD)/0.5,0,1) : 0;
  /* legacy: how strongly routes that have ended are drawn. Full on the opening frame and the closing card, a faint trace in between. */
  const legacy = mode==='hook' ? 1 : mode==='rewind' ? 1-clamp((f-HOOK)/0.35,0,1) : endA;
  const z = mode==='hook' ? 1 : ease(clamp((t-ZOOM0)/(ZOOM1-ZOOM0),0,1));
  const S=Math.exp(lerp(Math.log(VIEW_OLD.S),Math.log(VIEW_ALL.S),z)), clon=lerp(VIEW_OLD.lon,VIEW_ALL.lon,z), clat=lerp(VIEW_OLD.lat,VIEW_ALL.lat,z);
  const OX=W/2-clon*KX*S, OY=MAPT+MAPH/2+clat*S;

  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.beginPath(); ctx.rect(0,MAPT,W,MAPH); ctx.clip();
  ctx.fillStyle=C.sea; ctx.fillRect(0,MAPT,W,MAPH);
  for(const o of OFFS){ ctx.setTransform(S,0,0,S,OX+o*S,OY); ctx.fillStyle=C.land; ctx.fill(landPath,'evenodd'); ctx.strokeStyle=C.coast; ctx.lineWidth=0.9/S; ctx.lineJoin='round'; ctx.stroke(landPath); }
  const cap = mode==='play' ? CAPS.find(c=>t>=c[1]&&t<c[2]) : null;
  const live=[]; for(const r of ROUTES){ if(t<r.ts) continue; r.grow=clamp((t-r.ts)/1.2,0,1); r.on=1-clamp((t-r.te)/0.8,0,1); live.push(r); }
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const pass of ['ghost','glow','core']) for(const r of live){ if(pass!=='ghost'&&r.on<=0) continue;
    const hot = cap && cap.r===r;
    for(const o of OFFS){ ctx.setTransform(S,0,0,S,OX+o*S,OY); ctx.beginPath(); for(const p of r.paths) trace(p,r.grow); ctx.strokeStyle=col(r);
      if(pass==='ghost'){ctx.globalAlpha=lerp(0.3,mode==='end'?0.7:0.92,legacy);ctx.lineWidth=lerp(1.3,2.2,legacy)/S;} else if(pass==='glow'){ctx.globalAlpha=(hot?0.42:0.2)*r.on;ctx.lineWidth=(hot?14:8)/S;} else {ctx.globalAlpha=0.96*r.on;ctx.lineWidth=(hot?4:2.6)/S;}
      ctx.stroke(); } }
  ctx.setTransform(1,0,0,1,0,0);
  for(const r of live){ if(r.on<=0||r.grow<1) continue;
    for(const p of r.paths){ const n=Math.max(1,Math.round(p.len/26));
      for(let k=0;k<n;k++){ const u=((f*7/p.len)+(k/n)+r.i*0.137)%1, q=along(p,u), edge=Math.min(1,u*12,(1-u)*12);
        for(const o of OFFS){ const x=OX+(q[0]+o)*S, y=OY+q[1]*S; if(x<-5||x>W+5) continue; ctx.globalAlpha=r.on*edge; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,2.8,0,6.2832); ctx.fill(); } } } }
  let capA=0;
  if(cap){ capA=clamp((t-cap[1])/0.2,0,1)*clamp((cap[2]-t)/0.2,0,1); const m=along(cap.r.paths[cap[4]||0],0.5); let px=OX+m[0]*S; const py=OY+m[1]*S; if(px<0) px+=W360*S; else if(px>W) px-=W360*S;
    const pulse=clamp((t-cap[1])/0.5,0,1);
    if(pulse<1){ ctx.globalAlpha=(1-pulse)*0.8; ctx.strokeStyle=col(cap.r); ctx.lineWidth=3; ctx.beginPath(); ctx.arc(px,py,10+pulse*34,0,6.2832); ctx.stroke(); }
    ctx.globalAlpha=capA; ctx.fillStyle=col(cap.r); ctx.beginPath(); ctx.arc(px,py,10,0,6.2832); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke(); }
  ctx.restore(); ctx.globalAlpha=1;
  ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,MAPT); ctx.lineTo(W,MAPT); ctx.moveTo(0,BY); ctx.lineTo(W,BY); ctx.stroke();

  /* top band: the headline on the opening, then the year */
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  const headA = f<START-0.3 ? 1 : 1-clamp((f-(START-0.3))/0.3,0,1);
  if(headA>0){ ctx.globalAlpha=headA; ctx.fillStyle=C.fg; ctx.font='800 84px Archivo, sans-serif'; ctx.fillText('4,000 years',56,112); ctx.fillText('of trade routes',56,204); }
  const yearA = clamp((f-START)/0.3,0,1);
  if(yearA>0){ ctx.globalAlpha=yearA;
    const yv=Math.round(Y(Math.min(t,TEND))), num=yv<1?String(Math.max(1,-yv)):String(yv), suf=yv<1?'BC':(yv<1000?'AD':'');
    ctx.fillStyle=C.fg; ctx.font='800 124px Archivo, sans-serif'; ctx.fillText(num,50,150); const nw=ctx.measureText(num).width;
    if(suf){ ctx.fillStyle=C.muted; ctx.font='700 50px Archivo, sans-serif'; ctx.fillText(suf,50+nw+14,150); }
    let era=ERAS[0][1]; for(const e of ERAS) if(yv>=e[0]) era=e[1];
    if(endA<1){ ctx.globalAlpha=yearA*(1-endA); ctx.fillStyle=C.soft; ctx.font='600 36px Archivo, sans-serif'; ctx.fillText(era,56,212); }
    /* cargo bar, top right */
    ctx.globalAlpha=yearA; const BX=590, BW=W-56-BX, MAXV=13000, v=cargo(Y(Math.min(t,TEND)));
    ctx.fillStyle=C.muted; ctx.font='500 21px "IBM Plex Mono", monospace'; try{ctx.letterSpacing='2px';}catch(e){} ctx.fillText('SEA CARGO PER YEAR',BX,58); try{ctx.letterSpacing='0px';}catch(e){}
    ctx.fillStyle=v==null?C.soft:C.fg; ctx.font='800 46px Archivo, sans-serif';
    ctx.fillText(v==null ? 'under 20 million t' : v<1000 ? (Math.round(v/10)*10)+' million t' : (v/1000).toFixed(1)+' billion t', BX, 112);
    ctx.fillStyle='#16335C'; ctx.fillRect(BX,130,BW,26); ctx.fillStyle=C.landR; ctx.fillRect(BX,130,Math.max(3,BW*(v||0)/MAXV),26);
    ctx.font='500 20px "IBM Plex Sans", sans-serif'; ctx.fillStyle=C.muted;
    [0,4,8,12].forEach(g=>{ const x=BX+BW*g*1000/MAXV; ctx.fillRect(x,156,1.5,8); ctx.textAlign=g?'center':'left'; ctx.fillText(g? g+' bn':'0',x,186); }); ctx.textAlign='left';
    if(endA>0){ ctx.globalAlpha=endA; ctx.fillStyle=C.soft; ctx.font='600 30px Archivo, sans-serif'; ctx.fillText('Namık Akman',56,212);
      ctx.fillStyle=C.muted; ctx.font='500 20px "IBM Plex Sans", sans-serif'; ctx.textAlign='right'; ctx.fillText('Figures: UNCTAD, SlaveVoyages',W-56,226); ctx.textAlign='left'; }
    /* colour key, inside the map */
    ctx.globalAlpha=yearA*(1-endA); ctx.textAlign='right'; ctx.font='500 24px "IBM Plex Sans", sans-serif';
    ctx.fillStyle='rgba(8,24,48,.72)'; ctx.beginPath(); ctx.roundRect(W-318,MAPT+14,304,84,10); ctx.fill();
    [['Sea and river',C.seaR,MAPT+48],['Caravan, road, rail',C.landR,MAPT+82]].forEach(l=>{ ctx.fillStyle=C.soft; ctx.fillText(l[0],W-30,l[2]); const w=ctx.measureText(l[0]).width; ctx.fillStyle=l[1]; ctx.fillRect(W-30-w-48,l[2]-11,36,6); });
    ctx.textAlign='left'; }
  ctx.globalAlpha=1;

  /* bottom band */
  if(headA>0){ ctx.globalAlpha=headA; ctx.fillStyle=C.landR; ctx.font='800 84px Archivo, sans-serif'; ctx.fillText('in 40 seconds.',56,BY+112); }
  if(cap && capA>0){ ctx.globalAlpha=capA; const r=cap.r, title=cap[5]||r.n;
    ctx.fillStyle=col(r); ctx.fillRect(56,BY+26,8,116);
    ctx.fillStyle=C.fg; ctx.font='800 48px Archivo, sans-serif'; ctx.fillText(title,88,BY+70);
    const nw=ctx.measureText(title).width; ctx.fillStyle=col(r); ctx.font='500 30px "IBM Plex Mono", monospace';
    if(!cap[5] && 88+nw+26+ctx.measureText(r.when).width<W-56) ctx.fillText(r.when,88+nw+26,BY+70);
    ctx.fillStyle=C.soft; let fs=38; ctx.font=`400 ${fs}px "IBM Plex Sans", sans-serif`; while(ctx.measureText(cap[3]).width>W-88-56 && fs>28){ fs--; ctx.font=`400 ${fs}px "IBM Plex Sans", sans-serif`; }
    ctx.fillText(cap[3],88,BY+126); }
  if(endA>0){ ctx.globalAlpha=endA; ctx.fillStyle=C.fg; ctx.font='700 42px Archivo, sans-serif';
    ctx.fillText('For 3,500 years, no trade route',56,BY+54); ctx.fillText('crossed the Atlantic or the Pacific.',56,BY+104);
    ctx.fillStyle=C.landR; ctx.fillText('Then, in 73 years, trade circled the globe.',56,BY+160); }
  if(mode==='play'){ ctx.globalAlpha=yearA; ctx.fillStyle=C.muted; ctx.font='500 24px "IBM Plex Sans", sans-serif'; ctx.textAlign='right'; ctx.fillText('Namık Akman',W-56,H-22); ctx.textAlign='left'; }
  ctx.globalAlpha=1; ctx.fillStyle=C.line; ctx.fillRect(0,H-8,W,8); ctx.fillStyle=C.landR; ctx.fillRect(0,H-8,W*f/TOTAL,8);
}
window.film={render,duration:TOTAL};

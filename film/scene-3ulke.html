<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Parite: Sığır — üç kıta finali</title>
<style>*{margin:0}html,body{height:100%;background:#000;overflow:hidden}
#stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas#c{display:block;background:#0b0906}</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<script>
/* Üç kıta finali · 14 sn · 2015=100 endeksli parite (sığır endeksi ÷ yem endeksi)
   ABD amber · AB mavi · TR kızıl — deterministik __seek(t) */
const W=1080,H=1920,DUR=14;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COL={bg0:'#0b0906',bg1:'#161009',dim:'#cbbfa8',dimmer:'#8a7c62',
 us:'#ffb056',eu:'#8aa0d8',tr:'#e2574c'};
let S=null;   // {US:[[ym,v100]..],EU:..,TR:..}
fetch('../data/cattle-parity.json').then(r=>r.json()).then(j=>{
  S={};
  for(const k of ['US','EU','TR'])
    S[k]=j.regions[k].rows.map(r=>[r[0],r[3]*100]);
  window.__ready=true;
});
const M={l:130,r:80,t:760,b:430};
const PW=W-M.l-M.r,PH=H-M.t-M.b;
const YMIN=50,YMAX=180;
/* zaman ekseni: 2010-01 .. 2026-07 → ortak ay indeksi */
const T0=2010*12, T1=2026*12+6;
const mi=ym=>{const [y,m]=ym.split('-').map(Number);return y*12+(m-1);};
const X=ym=>M.l+PW*((mi(ym)-T0)/(T1-T0));
const Y=v=>M.t+PH*(1-(v-YMIN)/(YMAX-YMIN));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const grain=document.createElement('canvas');grain.width=256;grain.height=256;
{const g=grain.getContext('2d');const im=g.createImageData(256,256);
 for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=22;}
 g.putImageData(im,0,0);}

function drawSeries(rows,col,glow,n){
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(X(rows[0][0]),Y(rows[0][1]));
  const k=Math.max(2,Math.min(rows.length,Math.floor(rows.length*n)));
  for(let i=1;i<k;i++)ctx.lineTo(X(rows[i][0]),Y(rows[i][1]));
  ctx.strokeStyle=glow;ctx.lineWidth=14;ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=6;ctx.stroke();
  const last=rows[k-1];
  ctx.beginPath();ctx.arc(X(last[0]),Y(last[1]),12,0,7);ctx.fillStyle=col;ctx.fill();
  return last;
}

function draw(t){
  if(!S)return;
  const p=Math.min(1,Math.max(0,t/DUR));
  const lineP=ease(Math.min(1,Math.max(0,(p-0.06)/0.66)));

  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#161009');bg.addColorStop(.5,'#0b0906');bg.addColorStop(1,'#080604');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.fillStyle=COL.dimmer;ctx.font='600 34px "IBM Plex Mono",monospace';
  ctx.globalAlpha=Math.min(1,p*6);
  ctx.fillText('ÜÇ KITA · 2010–2026 · 2015 = 100',W/2,200);
  ctx.fillStyle='#f5efe6';ctx.font='700 84px "IBM Plex Sans",sans-serif';
  ctx.fillText('Aynı soru,',W/2,320);
  ctx.fillText('üç farklı cevap',W/2,420);
  ctx.globalAlpha=1;

  /* lejant */
  ctx.font='600 40px "IBM Plex Sans",sans-serif';ctx.textAlign='left';
  const lg=[['ABD',COL.us],['AB',COL.eu],['TÜRKİYE',COL.tr]];
  let lxx=W/2-330;
  for(const [nm,c] of lg){
    ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(lxx,545,46,12,6);ctx.fill();
    ctx.fillStyle='#f5efe6';ctx.fillText(nm,lxx+60,560);
    lxx+=ctx.measureText(nm).width+170;
  }

  /* ızgara */
  ctx.strokeStyle='rgba(203,191,168,.13)';ctx.lineWidth=2;
  ctx.fillStyle=COL.dimmer;ctx.font='500 30px "IBM Plex Mono",monospace';ctx.textAlign='right';
  for(let v=60;v<=YMAX;v+=30){
    ctx.beginPath();ctx.moveTo(M.l,Y(v));ctx.lineTo(W-M.r,Y(v));ctx.stroke();
    ctx.fillText(String(v),M.l-18,Y(v)+10);
  }
  /* 100 çizgisi vurgulu */
  ctx.strokeStyle='rgba(245,239,230,.35)';ctx.setLineDash([10,10]);
  ctx.beginPath();ctx.moveTo(M.l,Y(100));ctx.lineTo(W-M.r,Y(100));ctx.stroke();
  ctx.setLineDash([]);
  ctx.textAlign='center';
  for(const yr of [2012,2016,2020,2024]){
    ctx.fillStyle='rgba(138,124,98,.8)';
    ctx.fillText(String(yr),X(yr+'-01'),M.t+PH+56);
  }

  /* üç seri */
  const lu=drawSeries(S.US,COL.us,'rgba(255,176,86,.3)',lineP);
  const le=drawSeries(S.EU,COL.eu,'rgba(138,160,216,.3)',lineP);
  const lt=drawSeries(S.TR,COL.tr,'rgba(226,87,76,.3)',lineP);

  /* final etiketleri: çizim bitince belirir */
  const fin=Math.min(1,Math.max(0,(p-0.74)/0.12));
  if(fin>0){
    ctx.globalAlpha=fin;
    ctx.font='700 46px "IBM Plex Mono",monospace';ctx.textAlign='right';
    /* etiketler: değere göre sırala, dikeyde 66px aralık zorla (çakışma önleme) */
    const labs=[[lu,COL.us],[le,COL.eu],[lt,COL.tr]]
      .map(([l,c])=>({v:Math.round(l[1]-100),c,y:Y(l[1])}))
      .sort((a,b)=>a.y-b.y);
    for(let i=1;i<labs.length;i++)
      if(labs[i].y-labs[i-1].y<92)labs[i].y=labs[i-1].y+92;
    for(const L of labs){
      ctx.fillStyle=L.c;
      ctx.fillText((L.v>=0?'+':'')+L.v+'%',W-M.r-6,L.y-20);
    }
    /* mesaj */
    ctx.textAlign='center';
    ctx.fillStyle='#f5efe6';ctx.font='600 46px "IBM Plex Sans",sans-serif';
    ctx.fillText('2015’ten beri sığır, yeme karşı', W/2, H-330);
    ctx.fillText('her üç kıtada da değer kazandı', W/2, H-265);
    ctx.globalAlpha=1;
  }

  ctx.textAlign='center';
  ctx.fillStyle='rgba(138,124,98,.75)';ctx.font='500 26px "IBM Plex Mono",monospace';
  ctx.fillText('Kaynak: FRED · EC Agrifood · TÜİK/EVDS — sığır endeksi ÷ yem endeksi',W/2,H-150);
  ctx.fillText('namikakman.dev · Parite: Sığır',W/2,H-102);

  const vg=ctx.createRadialGradient(W/2,H*0.45,H*0.25,W/2,H*0.5,H*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='overlay';
  for(let gy=0;gy<H;gy+=256)for(let gx=0;gx<W;gx+=256)ctx.drawImage(grain,gx,gy);
  ctx.globalCompositeOperation='source-over';
}
window.__dur=DUR;let manual=false;
window.__seek=t=>{manual=true;draw(t);};
let t0=null;
function loop(ts){if(manual)return;if(t0===null)t0=ts;
  draw(Math.min(((ts-t0)/1000)%(DUR+2),DUR));requestAnimationFrame(loop);}
requestAnimationFrame(loop);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
</script>
</body>
</html>

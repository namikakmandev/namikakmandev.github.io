name: Pricescraper queue probe

# Discovery only. The dev sandbox cannot reach any retail domain, so this runs
# the candidate-queue probe where the network works and commits the dump.
# No price is published from here; a parser gets written against the dump.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe candidate retail venues (BR, CA, JP, CN)
        run: python scripts/probe_pricescraper_queue.py
      - name: Backfill history with list prices (branch-only piggyback)
        run: python scripts/backfill_pricescraper_history.py
        continue-on-error: true
      - name: Commit the dump
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/_pricescraper-queue-probe.json data/pricescraper-history.json
          git diff --cached --quiet || git commit -m "data: pricescraper queue probe [skip ci]"
          for i in 1 2 4 8; do
            git push origin HEAD && break
            sleep $i
          done

name: List secret names

# Diagnostic: prints the NAMES of repository secrets so a workflow can be pointed
# at the right one. Values are never printed; the runner masks them anyway.

on:
  workflow_dispatch:

jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Secret names
        env:
          ALL: ${{ toJSON(secrets) }}
        run: echo "$ALL" | jq -r 'keys[]' | sed 's/^/secret: /'

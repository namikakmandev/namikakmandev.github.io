name: Fetch public data

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Boş = hepsi. Ya da isim: cattle-herd us-prices eu-vet-expenses ..."
        default: ""
      mode:
        description: "discover = kaynağın gerçek yapısını dök, ayrıştırma"
        default: ""
  schedule:
    - cron: "17 5 1 * *"   # her ayın 1'i

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          MODE: ${{ inputs.mode }}
        run: |
          pip install requests
          python scripts/probe_wayback_coverage.py
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: wayback coverage probe [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done

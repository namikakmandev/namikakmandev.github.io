name: Fetch public data

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Boş = hepsi. Ya da isim: cattle-herd us-prices eu-vet-expenses ..."
        default: ""
      mode:
        description: "discover = kaynağın gerçek yapısını dök, ayrıştırma"
        default: ""
  schedule:
    - cron: "17 5 1 * *"   # her ayın 1'i

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          MODE: ${{ inputs.mode }}
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
        run: python scripts/fetch.py ${{ inputs.only }}
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh via scripts/fetch.py [skip ci]"
          git push

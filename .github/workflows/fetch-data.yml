name: Fetch public data

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Boş = hepsi. Ya da isim: cattle-herd us-prices eu-vet-expenses ..."
        default: ""
      mode:
        description: "discover = kaynağın gerçek yapısını dök, ayrıştırma"
        default: ""
  schedule:
    - cron: "17 5 1 * *"   # her ayın 1'i

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Fetch
        env:
          MODE: ${{ inputs.mode }}
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
        run: python scripts/fetch.py ${{ inputs.only }}
      - name: Rebuild catalog
        run: python scripts/build_catalog.py
      - name: Commit
        if: ${{ inputs.mode != 'discover' }}
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "data: refresh via scripts/fetch.py [skip ci]"
          # main may have moved while the fetch ran (a merge, another run): rebase onto it and push.
          # On a conflict (two runs both rewrote the report or the catalog) this run's files win,
          # since each refresh writes complete files.
          branch="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase -X theirs "origin/$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying"; sleep $((i * 5))
          done
          echo "could not push after 5 attempts"; exit 1

name: Fetch public data

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Boş = hepsi. Ya da isim: cattle-herd us-prices eu-vet-expenses ..."
        default: ""
      mode:
        description: "discover = kaynağın gerçek yapısını dök, ayrıştırma"
        default: ""
  schedule:
    - cron: "17 5 1 * *"   # her ayın 1'i: her kaynak
    - cron: "23 6 * * *"   # her gün: yalnız günlük ve aylık seriler (scripts/daily_set.py), sonra "what moved"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Fetch
        env:
          MODE: ${{ inputs.mode }}
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
          FAOSTAT_USER: ${{ secrets.FAOSTAT_USER }}
          FAOSTAT_PASSWORD: ${{ secrets.FAOSTAT_PASSWORD }}
        run: |
          if [ "${{ github.event.schedule }}" = "23 6 * * *" ]; then
            python scripts/fetch.py $(python scripts/daily_set.py)
          else
            python scripts/fetch.py ${{ inputs.only }}
          fi
      # Both of these run even when the fetch reports a degraded source, so the data that
      # did come back is still published; the run stays red so the failure is visible.
      - name: Rebuild catalog
        if: ${{ always() }}
        run: python scripts/build_catalog.py
      - name: What moved
        if: ${{ always() }}
        run: python scripts/whats_moving.py
      # The front page: the site's own assistant writes the brief from today's note. A bad
      # morning at the model leaves yesterday's brief in place and never blocks the commit.
      - name: Daily brief
        if: ${{ always() && inputs.mode != 'discover' }}
        continue-on-error: true
        env:
          WORKER_URL: https://econ-mcp.akmannamik83.workers.dev
        run: python scripts/daily_brief.py
      - name: Commit
        if: ${{ always() && inputs.mode != 'discover' }}
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "data: refresh via scripts/fetch.py [skip ci]"
          # main may have moved while the fetch ran (a merge, another run): rebase onto it and push.
          # On a conflict (two runs both rewrote the report or the catalog) this run's files win,
          # since each refresh writes complete files.
          branch="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase -X theirs "origin/$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying"; sleep $((i * 5))
          done
          echo "could not push after 5 attempts"; exit 1

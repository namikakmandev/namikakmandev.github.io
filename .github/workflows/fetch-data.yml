name: Fetch public data

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Boş = hepsi. Ya da isim: cattle-herd us-prices eu-vet-expenses ..."
        default: ""
      mode:
        description: "discover = kaynağın gerçek yapısını dök, ayrıştırma"
        default: ""
  schedule:
    - cron: "17 5 1 * *"   # her ayın 1'i

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          MODE: ${{ inputs.mode }}
        run: |
          pip install requests
          if [ "${{ inputs.only }}" = "backfill" ]; then
            python scripts/backfill_pharma_prices.py
          else
            MODE=${{ inputs.mode }} python scripts/fetch_pharma_prices.py
          fi
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/pharma-prices.json data/_pharma-prices-report.json
          git diff --cached --quiet || git commit -m "data: pharma backfill pass 2 [skip ci]"
          for i in 1 2 3 4; do
            git push && break
            git pull --rebase || exit 1
          done

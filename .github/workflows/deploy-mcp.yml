name: Test MCP server

# Typechecks and tests mcp/ on every change. Deployment is not done here: the Worker is
# connected to this repository through Cloudflare Workers Builds, which builds and deploys
# every push to main that touches mcp/ (see mcp/README.md).

on:
  push:
    branches: [main]
    paths: ["mcp/**", ".github/workflows/deploy-mcp.yml"]
  pull_request:
    paths: ["mcp/**", ".github/workflows/deploy-mcp.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

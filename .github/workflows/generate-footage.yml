name: Generate AI footage (Runway)

on:
  workflow_dispatch:
    inputs:
      shots:
        description: "Çekimler: '1' | '1,5,12' | '1-12'"
        default: "1"
      takes:
        description: "Çekim başına deneme sayısı"
        default: "1"
      model:
        description: "gen3a_turbo (taslak ~$0.50/10sn) | gen4.5 (final ~$1.50/10sn)"
        default: "gen3a_turbo"
      duration:
        description: "Saniye (5 veya 10)"
        default: "10"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate shots via Runway API
        env:
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          SHOTS: ${{ inputs.shots }}
          TAKES: ${{ inputs.takes }}
          MODEL: ${{ inputs.model }}
          DURATION: ${{ inputs.duration }}
        run: python scripts/generate_footage.py
      - name: Commit footage
        if: always()
        run: |
          git config user.name "footage-bot"
          git config user.email "actions@github.com"
          git add footage || true
          git diff --cached --quiet || git commit -m "footage: AI shots ${{ inputs.shots }} [skip ci]"
          git push

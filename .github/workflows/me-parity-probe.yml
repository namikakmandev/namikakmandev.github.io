name: Probe Middle East parity sources

# Discovery only. Answers the open questions in notes/parite-sigir-middle-east.md
# by dumping what each candidate source actually returns. Writes no analysis data.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe candidate sources
        run: python scripts/probe_me_parity.py
      - name: Commit probe report
        run: |
          git config user.name "cattle-data-bot"
          git config user.email "actions@github.com"
          git add data/_me-parity-probe.json data/_probe-il-chapter-*.xml
          git diff --cached --quiet || git commit -m "data: middle east parity source probe [skip ci]"
          git push

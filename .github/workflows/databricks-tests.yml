name: Databricks data-validation tests

# Runs the tests in databricks-tests/config/tests.yml against your workspace.
# Secrets to add under Settings -> Secrets and variables -> Actions:
#   DATABRICKS_HOST          e.g. https://adb-123456789.7.azuredatabricks.net
#   DATABRICKS_TOKEN         personal access token or service-principal token
#   DATABRICKS_WAREHOUSE_ID  SQL warehouse id
#   SOURCE_API_TOKEN         (optional) token for the reference API, if used
#   SOURCE_DB_URL            (optional) SQLAlchemy URL of the reference SQL database
#   POWERBI_TENANT_ID/POWERBI_CLIENT_ID/POWERBI_CLIENT_SECRET
#                            (optional) service principal for Power BI references
on:
  schedule:
    - cron: "0 5 * * 1-5"    # weekdays at 05:00 UTC (08:00 İstanbul)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: databricks-tests
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r databricks-tests/requirements.txt

      - name: Run data-validation tests
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          SOURCE_API_TOKEN: ${{ secrets.SOURCE_API_TOKEN }}
          SOURCE_DB_URL: ${{ secrets.SOURCE_DB_URL }}
          POWERBI_TENANT_ID: ${{ secrets.POWERBI_TENANT_ID }}
          POWERBI_CLIENT_ID: ${{ secrets.POWERBI_CLIENT_ID }}
          POWERBI_CLIENT_SECRET: ${{ secrets.POWERBI_CLIENT_SECRET }}
        run: python databricks-tests/run_tests.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databricks-test-report
          path: databricks-tests/results/report.md

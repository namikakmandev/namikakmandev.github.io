name: Fetch CMA vet report PDFs

# One-off document fetcher: the sandbox that edits this repo cannot reach
# gov.uk, so the runner downloads the CMA final-report documents instead.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Boş = case sayfalarını tara. Ya da tam PDF URL listesi (boşlukla ayrılmış)."
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          URLS: ${{ inputs.urls }}
        run: |
          set -u
          DIR=notes/sources/cma
          mkdir -p "$DIR"
          if [ -n "$URLS" ]; then
            printf '%s\n' $URLS > /tmp/want.txt
          else
            # find the case page(s) via the gov.uk search API, then read each
            # page's content-API JSON, which lists every attachment asset URL
            : > /tmp/pages.txt
            curl -s --max-time 60 "https://www.gov.uk/api/search.json?q=veterinary+services+household+pets+market+investigation&count=30" \
              | grep -oE '"link":"[^"]+"' | cut -d'"' -f4 | sort -u > /tmp/links.txt
            echo "gov.uk pages found:"; cat /tmp/links.txt
            while read -r l; do
              case "$l" in /*) curl -s --max-time 60 "https://www.gov.uk/api/content$l" >> /tmp/pages.txt || true;; esac
            done < /tmp/links.txt
            grep -oE 'https://assets\.publishing\.service\.gov\.uk/media/[a-z0-9]+/[^"]+\.pdf' /tmp/pages.txt \
              | sort -u > "$DIR/manifest.txt"
            wc -l < "$DIR/manifest.txt" | xargs echo "PDF links found:"
            grep -iE '/[^/]*(final|appendi|summary|remed|profit|medicin)[^/]*\.pdf$' "$DIR/manifest.txt" > /tmp/want.txt || true
            # known direct links (from public search) in case the API misses them
            cat >> /tmp/want.txt <<'KNOWN'
          https://assets.publishing.service.gov.uk/media/69c2ad8d13f1436476e44382/Final_decision_report_-_Part_B_24.3.26.pdf
          https://assets.publishing.service.gov.uk/media/69c22ac8d588c92c483e4c01/Summary_of_final_report_24.3.26.pdf
          https://assets.publishing.service.gov.uk/media/69020088e6e3290939a1d0dd/Provisional_Findings_Part_A_29_October_2025__2_.pdf
          https://assets.publishing.service.gov.uk/media/68130b11c47c2060a912172b/Remedies_-_vets_market_investigation_working_paper__1_.pdf
          KNOWN
            sed -i 's/^ *//' /tmp/want.txt
            sort -u /tmp/want.txt -o /tmp/want.txt
          fi
          echo "downloading:"; cat /tmp/want.txt
          while read -r u; do
            [ -z "$u" ] && continue
            f="$DIR/$(basename "$u")"
            curl -sL --max-time 300 --max-filesize 41943040 -o "$f" "$u" \
              && echo "ok  $f ($(stat -c%s "$f") bytes)" \
              || { echo "SKIP $u"; rm -f "$f"; }
          done < /tmp/want.txt
          ls -la "$DIR"
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add notes/sources/cma/
          git diff --cached --quiet || git commit -m "notes: CMA vet final-report source PDFs via Actions [skip ci]"
          git push

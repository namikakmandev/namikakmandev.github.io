name: Fetch livestock insurance data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover = kaynak yapısını dök | boş = tam çekim"
        default: "discover"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pdfplumber
      - name: Fetch
        env:
          MODE: ${{ inputs.mode }}
        run: python scripts/fetch_livestock_ins.py
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/livestock-ins*.json
          git diff --cached --quiet || git commit -m "data: livestock insurance fetch [skip ci]"
          git push

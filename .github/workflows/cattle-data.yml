name: Fetch cattle parity data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "boş=tam çekim | discover=EVDS mısır kataloğu | corn=hepsi-mısır sağlamlık verisi"
        default: ""
      corn_tr_code:
        description: "TR mısır EVDS seri kodu (corn modu için)"
        default: ""
      wide:
        description: "discover modunda tüm katalogu tara (1/0)"
        default: "0"
      il_output_id:
        description: "İsrail CBS tarımsal ÜRETİCİ fiyat endeksi id (boş=katalogdan çöz)"
        default: ""
      il_fodder_id:
        description: "İsrail CBS yem (fodder) girdi endeksi id (boş=katalogdan çöz)"
        default: ""
      sa_wpi_csv:
        description: "S.Arabistan WPI CSV URL'si (month,series,value) — GASTAT API yoksa"
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install evds pandas
      - name: Fetch series
        env:
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
          MODE: ${{ inputs.mode }}
          CORN_TR_CODE: ${{ inputs.corn_tr_code }}
          WIDE: ${{ inputs.wide }}
          IL_OUTPUT_ID: ${{ inputs.il_output_id }}
          IL_FODDER_ID: ${{ inputs.il_fodder_id }}
          SA_WPI_CSV: ${{ inputs.sa_wpi_csv }}
        run: |
          mkdir -p data
          python scripts/fetch_cattle_data.py
      - name: Commit data
        run: |
          git config user.name "cattle-data-bot"
          git config user.email "actions@github.com"
          git add data/cattle-*.json data/corn-parity.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: refresh cattle parity series [skip ci]"
          git push

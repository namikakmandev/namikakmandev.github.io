name: Fetch cattle parity data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch series
        run: |
          mkdir -p data
          python scripts/fetch_cattle_data.py
      - name: Commit data
        run: |
          git config user.name "cattle-data-bot"
          git config user.email "actions@github.com"
          git add data/cattle-*.json
          git diff --cached --quiet || git commit -m "data: refresh cattle parity series [skip ci]"
          git push

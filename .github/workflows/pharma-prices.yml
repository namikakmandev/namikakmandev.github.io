name: Pharma price tracker

# Daily scrape of 5 canine dermatology product prices (Cytopoint, Apoquel,
# Apoquel Chewable, Numelvi, Zenrelia) from US online pet pharmacies.
# Appends to data/pharma-prices.json; per-run diagnostics go to
# data/_pharma-prices-report.json so a broken extractor is visible without
# re-running locally. Charted at pharma-prices.html.

on:
  schedule:
    - cron: "37 13 * * *"   # daily 13:37 UTC — US stores' pages are warm, avoids :00 crowds
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pharma-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Committed so the report works where a live FX call cannot run: inside a
      # published artifact's CSP, and offline. Non-fatal - the page falls back
      # to the live call, and the script keeps any existing file on failure.
      - name: Refresh USD cross-rates
        continue-on-error: true
        run: python scripts/fetch_fx_usd.py

      - name: Scrape prices
        run: python scripts/fetch_pharma_prices.py

      - name: Publish the source list
        run: python scripts/build_venue_sources.py

      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/pharma-prices.json data/_pharma-prices-report.json data/fx-usd.json \
                  data/venue-sources.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "data: refresh pharma prices [skip ci]"
          for i in 1 2 3 4; do
            git push origin HEAD && break
            git pull --rebase || exit 1
          done

name: Yatirim Radar data

# data/yatirim-radar.json'u Yahoo Finance'ten tazeler (BIST + madenler + emtia).
# Anahtar gerektirmez; scripts/fetch_yatirim_radar.py stdlib-only çalışır.
on:
  schedule:
    - cron: "*/15 7-14 * * 1-5"  # BIST seansı boyunca 15 dk'da bir (10:00-17:45 İstanbul) — FAST mod
    - cron: "40 15 * * 1-5"      # hafta içi 15:40 UTC (18:40 İstanbul, kapanış sonrası) — tam mod
  workflow_dispatch: {}           # Actions sekmesinden elle de çalıştırılabilir (tam mod)

permissions:
  contents: write

concurrency:
  group: yatirim-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build yatirim-radar.json
        env:
          # Gün içi 15 dk'lık koşular FAST modda: fiyat/teknikler tazelenir,
          # rasyo + haberler önceki JSON'dan taşınır. Kapanış koşusu ve elle
          # tetikleme tam mod çalışır.
          FAST: ${{ github.event_name == 'schedule' && github.event.schedule != '40 15 * * 1-5' && '1' || '' }}
        run: python scripts/fetch_yatirim_radar.py

      - name: Commit if changed
        run: |
          if git status --porcelain data/yatirim-radar.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/yatirim-radar.json
            git commit -m "chore: refresh yatirim-radar data [skip ci]"
            git push
          else
            echo "yatirim-radar.json unchanged — nothing to commit."
          fi

<text x="130" y="120" font-size="62" font-weight="700" fill="#1f2430">Four years when Europe&#8217;s inflation</text>
<text x="130" y="196" font-size="62" font-weight="700" fill="#1f2430">forecasters <tspan fill="#d94040">all missed together</tspan></text>
<text x="130" y="270" font-size="33" fill="#5b6472">Each bar: the share of the ECB&#8217;s forecaster panel whose own 80% range</text>
<text x="130" y="314" font-size="33" fill="#5b6472">contained that year&#8217;s euro-area inflation. 64 forecasters, 2000&#8211;2025.</text>
<text x="130" y="378" font-size="30" font-weight="700" fill="#d94040">In 2008, and again in 2021, 2022 and 2023: not one of them.</text>

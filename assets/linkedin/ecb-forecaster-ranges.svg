<text x="118" y="54" font-size="38" font-weight="700" fill="#1f2430">What a miss looks like &#8212; ECB panel, euro-area inflation, 2000&#8211;2025</text>
<text x="118" y="112" font-size="23" fill="#5b6472">Each bar is the range one forecaster published for that year&#8217;s euro-area inflation &#8212; the middle 80% of what they thought possible.</text>
<text x="118" y="142" font-size="23" fill="#5b6472">The dot is what inflation actually did. Dot inside the bar = <tspan fill="#2e9e5b" font-weight="700">a hit</tspan>. Dot outside = <tspan fill="#d94040" font-weight="700">a miss</tspan>. A year with no bar is a year they were not on the panel.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<rect width="1600" height="1000" fill="#fff"/>
<text x="118" y="56" font-size="37" font-weight="700" fill="#0b0b0b">How one price point becomes 44% or 3%</text>
<text x="118" y="100" font-size="24" fill="#52514e">Raise price 1%, sell the same volume, change nothing else. The extra revenue has no cost attached, so all of it</text>
<text x="118" y="132" font-size="24" fill="#52514e">lands in operating profit. Every business gains the same one point of margin; what differs is the profit it already had.</text>
<text x="118" y="180" font-size="25" font-weight="700" fill="#0b0b0b">Thin margin, huge leverage. Fat margin, small leverage. The rule is one divided by the operating margin.</text>
<text x="942" y="280" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="end">US grocery retail</text>
<text x="1222" y="280" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="end">The 1992 sample</text>
<text x="1502" y="280" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="end">US pharmaceuticals</text>
<line x1="118" y1="300" x2="1518" y2="300" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="118" y="342" font-size="24" fill="#52514e">Operating margin</text>
<text x="942" y="342" font-size="24" fill="#0b0b0b" text-anchor="end">2.3%</text>
<text x="1222" y="342" font-size="24" fill="#0b0b0b" text-anchor="end">9.0%</text>
<text x="1502" y="342" font-size="24" fill="#0b0b0b" text-anchor="end">29.5%</text>
<line x1="118" y1="362" x2="1518" y2="362" stroke="#e1e0d9" stroke-width="1"/>
<text x="118" y="404" font-size="24" fill="#52514e">Revenue</text>
<text x="942" y="404" font-size="24" fill="#0b0b0b" text-anchor="end">100</text>
<text x="1222" y="404" font-size="24" fill="#0b0b0b" text-anchor="end">100</text>
<text x="1502" y="404" font-size="24" fill="#0b0b0b" text-anchor="end">100</text>
<line x1="118" y1="424" x2="1518" y2="424" stroke="#e1e0d9" stroke-width="1"/>
<text x="118" y="466" font-size="24" fill="#52514e">Operating costs</text>
<text x="942" y="466" font-size="24" fill="#0b0b0b" text-anchor="end">97.7</text>
<text x="1222" y="466" font-size="24" fill="#0b0b0b" text-anchor="end">91.0</text>
<text x="1502" y="466" font-size="24" fill="#0b0b0b" text-anchor="end">70.5</text>
<line x1="118" y1="486" x2="1518" y2="486" stroke="#e1e0d9" stroke-width="1"/>
<text x="118" y="528" font-size="24" fill="#0b0b0b" font-weight="700">Operating profit</text>
<text x="942" y="528" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">2.29</text>
<text x="1222" y="528" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">9.00</text>
<text x="1502" y="528" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">29.54</text>
<line x1="118" y1="548" x2="1518" y2="548" stroke="#e1e0d9" stroke-width="1"/>
<text x="118" y="590" font-size="24" fill="#52514e">Price +1%, same volume: revenue</text>
<text x="942" y="590" font-size="24" fill="#0b0b0b" text-anchor="end">101</text>
<text x="1222" y="590" font-size="24" fill="#0b0b0b" text-anchor="end">101</text>
<text x="1502" y="590" font-size="24" fill="#0b0b0b" text-anchor="end">101</text>
<line x1="118" y1="610" x2="1518" y2="610" stroke="#e1e0d9" stroke-width="1"/>
<text x="118" y="652" font-size="24" fill="#52514e">Operating costs, unchanged</text>
<text x="942" y="652" font-size="24" fill="#0b0b0b" text-anchor="end">97.7</text>
<text x="1222" y="652" font-size="24" fill="#0b0b0b" text-anchor="end">91.0</text>
<text x="1502" y="652" font-size="24" fill="#0b0b0b" text-anchor="end">70.5</text>
<line x1="118" y1="672" x2="1518" y2="672" stroke="#e1e0d9" stroke-width="1"/>
<text x="118" y="714" font-size="24" fill="#0b0b0b" font-weight="700">Operating profit</text>
<text x="942" y="714" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">3.29</text>
<text x="1222" y="714" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">10.00</text>
<text x="1502" y="714" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">30.54</text>
<line x1="118" y1="734" x2="1518" y2="734" stroke="#e1e0d9" stroke-width="1"/>
<text x="118" y="776" font-size="24" fill="#0b0b0b" font-weight="700">Operating profit gain</text>
<text x="942" y="776" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">+43.6%</text>
<text x="1222" y="776" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">+11.1%</text>
<text x="1502" y="776" font-size="24" fill="#0b0b0b" font-weight="700" text-anchor="end">+3.4%</text>
<line x1="118" y1="796" x2="1518" y2="796" stroke="#e1e0d9" stroke-width="1"/>
<text x="118" y="934" font-size="22" fill="#0b0b0b">It runs the other way too: a 1% price cut takes the same share of profit away, which is why grocers fight over pennies.</text>
<text x="118" y="964" font-size="22" fill="#0b0b0b">Volume is held constant throughout. A real price move costs volume; the elasticity is the job the identity leaves you with.</text>
<text x="118" y="990" font-size="17" fill="#898781">Margins: Damodaran, NYU Stern, US industry tables, Jan 2026; the 1992 sample is the margin implied by the 11.1% claim &#183; namikakmandev.github.io/price-leverage.html</text>
</svg>
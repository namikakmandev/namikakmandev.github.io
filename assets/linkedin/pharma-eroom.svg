<text x="118" y="56" font-size="37" font-weight="700" fill="#1f2430">The US, 2008&#8211;2021: Eroom&#8217;s Law said drug productivity halves every nine years</text>
<text x="118" y="100" font-size="24" fill="#5b6472">US new molecular entities approved per billion dollars of US pharmaceutical business R&amp;D, in constant prices.</text>
<text x="118" y="132" font-size="24" fill="#5b6472">Red dashed: where the ratio should be if the law still held. Blue: the trend through what actually happened, with the yearly figures behind it.</text>
<text x="118" y="176" font-size="25" font-weight="700" fill="#d94040">It did not continue: the ratio is flat to rising, and the law&#8217;s own rate is rejected in every specification tested.</text>

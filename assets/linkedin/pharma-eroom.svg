<text x="1524.0" y="396.5" font-size="23" font-weight="700" fill="#2f9bff" text-anchor="end">the trend: flat</text>
<text x="1518.0" y="774.6" font-size="23" font-weight="700" fill="#d94040" text-anchor="end">Eroom&#8217;s Law predicts 0.17</text>
<text x="118" y="958" font-size="22" fill="#1f2430">By 2021 the law implies 0.17 approvals per billion. The figure was 0.55 &#8212; more than 3 times higher.</text>
<text x="118" y="988" font-size="22" fill="#1f2430">The swings are approvals, not spending: real R&amp;D grows smoothly and accounts for only 10% of the ratio&#8217;s movement.</text>
<text x="118" y="1016" font-size="22" fill="#1f2430">This tests only whether the published rate continued. The paper&#8217;s own 1950&#8211;2010 window cannot be re-measured from open data.</text>
<text x="118" y="1044" font-size="17" fill="#5b6472">Data: FDA Drugs@FDA submission records (new molecular entities) and Eurostat rd_e_berdindr2 NACE C21, deflated by the US GDP price index &#183; namikakmandev.github.io/pharma-eroom.html</text>

<text x="890.8" y="228" font-size="21" font-weight="700" fill="#0b0b0b">HBR 1992: 11.1%</text>
<text x="330" y="934" font-size="22" fill="#0b0b0b">Above the line: thinner margins than the 1992 sample, so a price point is worth more of the profit. Below: less.</text>
<text x="330" y="964" font-size="22" fill="#0b0b0b">Aggregates include loss-makers. The median US industry gives 8.1%; the spread by industry is on the page.</text>
<text x="330" y="990" font-size="17" fill="#898781">Data: Damodaran, NYU Stern, margin tables by region, Total Market row, pre-tax unadjusted operating margin, Jan 2026 &#183; namikakmandev.github.io/price-leverage.html</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<rect width="1600" height="1000" fill="#fff"/>
<text x="330" y="56" font-size="37" font-weight="700" fill="#0b0b0b">The 11% rule, recomputed for every region, January 2026</text>
<text x="330" y="100" font-size="24" fill="#52514e">Operating profit gained from a 1% price improvement, volume unchanged. It is one over the operating margin,</text>
<text x="330" y="132" font-size="24" fill="#52514e">so it is a fact about margins: revenue-weighted across every listed company Damodaran covers in each region.</text>
<text x="330" y="180" font-size="25" font-weight="700" fill="#0b0b0b">Published in 1992. The US today: <tspan fill="#2a78d6">7.8%</tspan>. Nearest to 11.1 now: <tspan fill="#2a78d6">emerging markets</tspan>.</text>

<text x="118" y="56" font-size="37" font-weight="700" fill="#1f2430">The rise happened before AI could have caused it</text>
<text x="118" y="100" font-size="24" fill="#5b6472">New molecular entities approved by the FDA each year. The step up is complete by 2017; AI-designed molecules</text>
<text x="118" y="132" font-size="24" fill="#5b6472">reached the clinic around 2020 and have almost no approvals yet. This does not test what did cause it.</text>
<text x="118" y="180" font-size="25" font-weight="700" fill="#1f2430">2005&#8211;2016: 28 a year on average.   2017&#8211;2025: 50. <tspan fill="#e2811f">1.8&#215; more.</tspan></text>

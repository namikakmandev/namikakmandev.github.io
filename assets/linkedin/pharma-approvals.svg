<text x="118" y="826" font-size="22" fill="#1f2430">The ratio chart stops in 2021 because the R&amp;D series does. Approvals run to 2025; 2026 is a part year at the data cut-off and is left out.</text>
<text x="118" y="856" font-size="22" fill="#1f2430">The orange bars are years with approvals but no matching R&amp;D figure, so they cannot enter the productivity ratio.</text>
<text x="118" y="884" font-size="17" fill="#5b6472">Data: FDA Drugs@FDA submission records, original applications approved as submission class 7 or 8 &#183; namikakmandev.github.io/pharma-eroom.html</text>

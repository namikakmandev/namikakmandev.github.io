<rect width="1600" height="1000" fill="#fff"/>
<text x="90" y="52" font-size="37" font-weight="700" fill="#1f2430">They are not interchangeable &#8212; and the consensus hides it</text>
<text x="90" y="94" font-size="23" fill="#5b6472">Each bar is one anonymous ECB forecaster: how much better or worse their 80% ranges held up than an average</text>
<text x="90" y="124" font-size="23" fill="#5b6472">forecaster facing the same years. 64 forecasters with 10+ scored years, euro-area inflation, 2000&#8211;2025.</text>
<text x="90" y="154" font-size="21" fill="#5b6472">Grey band = the spread pure luck would produce if every forecaster were equally good.</text>

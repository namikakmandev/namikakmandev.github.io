<text x="118" y="56" font-size="37" font-weight="700" fill="#0b0b0b">The US is not on the 11% rule. Emerging markets are.</text>
<text x="118" y="100" font-size="24" fill="#52514e">Operating profit gained from a 1% price improvement, one over the aggregate operating margin, one point per edition of</text>
<text x="118" y="132" font-size="24" fill="#52514e">Damodaran&#8217;s industry tables. Each January edition reflects the previous fiscal year. Dashed: the 1992 figure.</text>
<text x="118" y="180" font-size="25" font-weight="700" fill="#0b0b0b">US: below 11.1 in every edition since <tspan fill="#2a78d6">2014</tspan>; 2026: <tspan fill="#2a78d6">7.8%</tspan>.   Emerging markets 2026: <tspan fill="#1baf7a">11.0%</tspan>.</text>

<text x="118" y="934" font-size="22" fill="#0b0b0b">Same identity, same source, every year: the line moves only because operating margins do. US margins widened; emerging-market margins did not.</text>
<text x="118" y="964" font-size="22" fill="#0b0b0b">Editions are labelled by the January they were published. Earlier US editions use another layout and are kept apart: see the page.</text>
